name: urbanpulse_app
description: UrbanPulse Bangalore — Real-time traffic & air quality intelligence
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  
  # Networking
  http: ^1.3.0
  dio: ^5.7.0
  
  # Charts & Visualization
  fl_chart: ^0.70.2
  
  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # Typography
  google_fonts: ^6.2.1
  
  # UI Polish
  shimmer: ^3.0.0
  lottie: ^3.3.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  
  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/lottie/
